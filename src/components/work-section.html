<div class="">
  <div
    class="mx-auto max-w-7xl px-4 py-16"
    data-aos="fade-up"
    data-aos-duration="1000"
    aria-labelledby="exp-title"
  >
    <div class="mb-6 flex items-end justify-between gap-4">
      <div class="">
        <div>
          <p class="text-2xl tracking-widest text-gray-500 font-bold font-mono">
            Experience
          </p>
        </div>
        <h2 class="text-4xl font-bold text-white">My Work Experience</h2>
        <p class="mt-2 max-w-2xl text-gray-500">
          An overview of my professional experience, contributions, and journey
          in the field of information technology and software development.
        </p>
      </div>

      <!-- Tombol navigasi -->
      <div class="flex items-center gap-3">
        <span
          id="counter"
          class="text-sm text-gray-500"
          aria-live="polite"
        ></span>
        <button
          id="prev"
          type="button"
          aria-label="Sebelumnya"
          class="flex h-10 w-10 items-center justify-center rounded-full border border-gray-600 text-gray-300 transition hover:bg-gray-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white disabled:cursor-not-allowed disabled:opacity-30 disabled:hover:bg-transparent"
        >
          <svg
            class="h-5 w-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m15 18-6-6 6-6" />
          </svg>
        </button>
        <button
          id="next"
          type="button"
          aria-label="Berikutnya"
          class="flex h-10 w-10 items-center justify-center rounded-full border border-gray-600 text-gray-300 transition hover:bg-gray-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white disabled:cursor-not-allowed disabled:opacity-30 disabled:hover:bg-transparent"
        >
          <svg
            class="h-5 w-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Track: satu slide = satu kartu lebar -->
    <div
      id="track"
      class="flex snap-x snap-mandatory gap-4 overflow-x-auto scroll-smooth [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"
      role="region"
      aria-label="Daftar pengalaman kerja"
    ></div>

    <!-- Indikator titik -->
    <div id="dots" class="mt-5 flex justify-center gap-2"></div>
  </div>
</div>
